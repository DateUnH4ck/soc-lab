# =============================================================================
#  soc-lab · Laboratorio SOC del curso "De 0 a Analista SOC N2" (@DateUnH4ck)
#  Funciona en x86_64 (PC Windows/Linux) y ARM64 (Mac Apple Silicon, Linux ARM).
#
#  No lo arranques a mano la primera vez: usa ./lab.sh setup (Mac/Linux)
#  o .\lab.ps1 setup (Windows). Ver README.md.
#
#  Redes:
#    soc  (172.30.20.0/24) -> SIEM (Wazuh) y agentes
#    dmz  (172.30.10.0/24) -> victimas y atacante. El atacante NO ve el SIEM.
#
#  Los servicios de Wazuh se basan en wazuh/wazuh-docker (GPLv2), single-node.
# =============================================================================

name: soc-lab

x-restart: &restart
  restart: unless-stopped

services:
  # ---------------------------------------------------------------------------
  #  SIEM: Wazuh (indexer + manager + dashboard)
  # ---------------------------------------------------------------------------
  wazuh.indexer:
    <<: *restart
    image: wazuh/wazuh-indexer:${WAZUH_VERSION:-4.14.9}
    hostname: wazuh.indexer
    environment:
      - "OPENSEARCH_JAVA_OPTS=-Xms${INDEXER_HEAP:-1g} -Xmx${INDEXER_HEAP:-1g}"
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    ports:
      # Solo accesible desde tu ordenador (127.0.0.1), nunca desde tu red.
      - "127.0.0.1:${INDEXER_PORT:-9200}:9200"
    volumes:
      - wazuh-indexer-data:/var/lib/wazuh-indexer
      - ./wazuh/certs/root-ca.pem:/usr/share/wazuh-indexer/config/certs/root-ca.pem
      - ./wazuh/certs/wazuh.indexer-key.pem:/usr/share/wazuh-indexer/config/certs/wazuh.indexer.key
      - ./wazuh/certs/wazuh.indexer.pem:/usr/share/wazuh-indexer/config/certs/wazuh.indexer.pem
      - ./wazuh/certs/admin.pem:/usr/share/wazuh-indexer/config/certs/admin.pem
      - ./wazuh/certs/admin-key.pem:/usr/share/wazuh-indexer/config/certs/admin-key.pem
      - ./wazuh/indexer/wazuh.indexer.yml:/usr/share/wazuh-indexer/config/opensearch.yml
      - ./wazuh/indexer/internal_users.yml:/usr/share/wazuh-indexer/config/opensearch-security/internal_users.yml
    healthcheck:
      test: ["CMD-SHELL", "curl -sk -u admin:${INDEXER_PASSWORD:-SecretPassword} https://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 60s
    networks: [soc]

  wazuh.manager:
    <<: *restart
    image: wazuh/wazuh-manager:${WAZUH_VERSION:-4.14.9}
    hostname: wazuh.manager
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 655360, hard: 655360 }
    ports:
      - "127.0.0.1:${API_PORT:-55000}:55000"
    environment:
      - INDEXER_URL=https://wazuh.indexer:9200
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=${INDEXER_PASSWORD:-SecretPassword}
      - FILEBEAT_SSL_VERIFICATION_MODE=full
      - SSL_CERTIFICATE_AUTHORITIES=/etc/ssl/root-ca.pem
      - SSL_CERTIFICATE=/etc/ssl/filebeat.pem
      - SSL_KEY=/etc/ssl/filebeat.key
      - API_USERNAME=wazuh-wui
      - API_PASSWORD=${API_PASSWORD:-MyS3cr37P450r.*-}
    volumes:
      - wazuh_api_configuration:/var/ossec/api/configuration
      - wazuh_etc:/var/ossec/etc
      - wazuh_logs:/var/ossec/logs
      - wazuh_queue:/var/ossec/queue
      - wazuh_var_multigroups:/var/ossec/var/multigroups
      - wazuh_integrations:/var/ossec/integrations
      - wazuh_active_response:/var/ossec/active-response/bin
      - wazuh_agentless:/var/ossec/agentless
      - wazuh_wodles:/var/ossec/wodles
      - filebeat_etc:/etc/filebeat
      - filebeat_var:/var/lib/filebeat
      - ./wazuh/certs/root-ca-manager.pem:/etc/ssl/root-ca.pem
      - ./wazuh/certs/wazuh.manager.pem:/etc/ssl/filebeat.pem
      - ./wazuh/certs/wazuh.manager-key.pem:/etc/ssl/filebeat.key
      - ./wazuh/manager/ossec.conf:/wazuh-config-mount/etc/ossec.conf
      - ./wazuh/manager/local_rules.xml:/wazuh-config-mount/etc/rules/local_rules.xml
    depends_on:
      wazuh.indexer:
        condition: service_healthy
    networks:
      soc:
        ipv4_address: 172.30.20.10

  wazuh.dashboard:
    <<: *restart
    image: wazuh/wazuh-dashboard:${WAZUH_VERSION:-4.14.9}
    hostname: wazuh.dashboard
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-443}:5601"
    environment:
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=${INDEXER_PASSWORD:-SecretPassword}
      - WAZUH_API_URL=https://wazuh.manager
      - DASHBOARD_USERNAME=kibanaserver
      - DASHBOARD_PASSWORD=kibanaserver
      - API_USERNAME=wazuh-wui
      - API_PASSWORD=${API_PASSWORD:-MyS3cr37P450r.*-}
    volumes:
      - ./wazuh/certs/wazuh.dashboard.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard.pem
      - ./wazuh/certs/wazuh.dashboard-key.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard-key.pem
      - ./wazuh/certs/root-ca.pem:/usr/share/wazuh-dashboard/certs/root-ca.pem
      - ./wazuh/dashboard/opensearch_dashboards.yml:/usr/share/wazuh-dashboard/config/opensearch_dashboards.yml
      - ./wazuh/dashboard/wazuh.yml:/usr/share/wazuh-dashboard/data/wazuh/config/wazuh.yml
      - wazuh-dashboard-config:/usr/share/wazuh-dashboard/data/wazuh/config
      - wazuh-dashboard-custom:/usr/share/wazuh-dashboard/plugins/wazuh/public/assets/custom
    depends_on:
      wazuh.indexer:
        condition: service_healthy
      wazuh.manager:
        condition: service_started
    networks: [soc]

  # ---------------------------------------------------------------------------
  #  Victimas (DMZ) con agente Wazuh
  # ---------------------------------------------------------------------------
  srv-web:
    <<: *restart
    build:
      context: ./victims/web
      args:
        WAZUH_VERSION: ${WAZUH_VERSION:-4.14.9}
    image: dateunh4ck/soc-lab-srv-web:local
    hostname: srv-web
    environment:
      - WAZUH_MANAGER_SERVER=wazuh.manager
      - WAZUH_AGENT_NAME=srv-web
      - WAZUH_AGENT_GROUP=default
    cap_add: [NET_ADMIN]          # para respuestas activas (firewall-drop)
    depends_on: [wazuh.manager]
    networks:
      soc: {}
      dmz:
        ipv4_address: 172.30.10.10

  srv-ssh:
    <<: *restart
    build:
      context: ./victims/ssh
      args:
        WAZUH_VERSION: ${WAZUH_VERSION:-4.14.9}
    image: dateunh4ck/soc-lab-srv-ssh:local
    hostname: srv-ssh
    environment:
      - WAZUH_MANAGER_SERVER=wazuh.manager
      - WAZUH_AGENT_NAME=srv-ssh
      - WAZUH_AGENT_GROUP=default
    cap_add: [NET_ADMIN]
    depends_on: [wazuh.manager]
    networks:
      soc: {}
      dmz:
        ipv4_address: 172.30.10.11

  # ---------------------------------------------------------------------------
  #  Atacante (solo en la DMZ)
  #  Entrar:  ./lab.sh attacker   (o: docker compose exec attacker bash)
  # ---------------------------------------------------------------------------
  attacker:
    <<: *restart
    build: ./attacker
    image: dateunh4ck/soc-lab-attacker:local
    hostname: kali
    command: ["sleep", "infinity"]
    networks:
      dmz:
        ipv4_address: 172.30.10.66

  # ---------------------------------------------------------------------------
  #  Herramientas (no arrancan con "up"; se ejecutan bajo demanda)
  # ---------------------------------------------------------------------------

  # Reproduce ataques reales de Windows/AD (EVTX) dentro de Wazuh.
  #   ./lab.sh replay --list
  #   ./lab.sh replay dcsync
  replayer:
    profiles: ["tools"]
    build: ./replayer
    image: dateunh4ck/soc-lab-replayer:local
    volumes:
      - wazuh_queue:/wazuh-queue
      - replayer-cache:/cache
    networks: [soc]

  # Genera los certificados TLS de Wazuh (lo lanza ./lab.sh setup).
  certs:
    profiles: ["setup"]
    build: ./wazuh/certs-generator
    image: dateunh4ck/soc-lab-certs:local
    environment:
      - CERT_TOOL_VERSION=4.14
    volumes:
      - ./wazuh/certs/:/certificates/
      - ./wazuh/certs.yml:/config/certs.yml

networks:
  soc:
    ipam:
      config:
        - subnet: 172.30.20.0/24
  dmz:
    ipam:
      config:
        - subnet: 172.30.10.0/24

volumes:
  wazuh_api_configuration:
  wazuh_etc:
  wazuh_logs:
  wazuh_queue:
  wazuh_var_multigroups:
  wazuh_integrations:
  wazuh_active_response:
  wazuh_agentless:
  wazuh_wodles:
  filebeat_etc:
  filebeat_var:
  wazuh-indexer-data:
  wazuh-dashboard-config:
  wazuh-dashboard-custom:
  replayer-cache:
