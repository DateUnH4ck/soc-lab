# rsyslog minimo para contenedor (sin systemd/journald).
# Formato syslog clasico: "Nov  1 16:00:00 srv-ssh sshd[123]: ..."
module(load="imuxsock" SysSock.Use="on")
$ActionFileDefaultTemplate RSYSLOG_TraditionalFileFormat
authpriv.*                    /var/log/secure
*.info;authpriv.none          /var/log/messages
