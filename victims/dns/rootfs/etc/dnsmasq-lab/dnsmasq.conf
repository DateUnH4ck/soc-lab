# =============================================================================
#  soc-lab · srv-dns · el DNS interno de Hackerlab Logística S.L.
#  Lo usan la Kali y los servidores. Cada consulta queda en /var/log/dnsmasq.log
# =============================================================================

# Escuchamos solo en la IP de la DMZ
listen-address=172.30.10.53
bind-interfaces

# Lo que no es nuestro se pregunta fuera, al DNS interno de Docker
no-resolv
no-hosts
server=127.0.0.11

# Registrar todas las consultas y respuestas (las lee el agente de Wazuh)
log-queries

# --- Zona interna: hackerlab.local ------------------------------------------
domain=hackerlab.local
local=/hackerlab.local/
host-record=srv-web.hackerlab.local,172.30.10.10
host-record=srv-ssh.hackerlab.local,172.30.10.11
host-record=srv-dns.hackerlab.local,172.30.10.53
host-record=srv-proxy.hackerlab.local,172.30.10.8
host-record=mail.hackerlab.local,172.30.10.25
cname=www.hackerlab.local,srv-web.hackerlab.local
mx-host=hackerlab.local,mail.hackerlab.local,10
txt-record=hackerlab.local,"v=spf1 mx -all"

# --- El dominio del atacante ------------------------------------------------
# malo.test (".test" es un dominio reservado: no existe en Internet).
# Cualquier subdominio resuelve a la Kali: sirve para simular un C2 o un
# túnel DNS sin salir del laboratorio.
address=/malo.test/172.30.10.66
