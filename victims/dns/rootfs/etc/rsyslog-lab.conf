# rsyslog mínimo para contenedor (sin systemd/journald).
# Formato syslog clásico: "Nov 17 16:00:00 srv-dns dnsmasq[12]: query[A] ..."
module(load="imuxsock" SysSock.Use="on")
$ActionFileDefaultTemplate RSYSLOG_TraditionalFileFormat

# Las consultas DNS, en su propio fichero
if $programname == 'dnsmasq' then {
  action(type="omfile" file="/var/log/dnsmasq.log")
  stop
}

*.info                        /var/log/messages
