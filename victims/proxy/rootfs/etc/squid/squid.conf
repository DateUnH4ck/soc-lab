# =============================================================================
#  soc-lab · srv-proxy · proxy de salida de Hackerlab Logística S.L. (Squid)
#  Uso desde la Kali:  curl -x http://srv-proxy.hackerlab.local:3128 <url>
# =============================================================================
http_port 3128
visible_hostname srv-proxy

# Solo pueden usarlo los equipos de la DMZ
acl dmz src 172.30.10.0/24
acl SSL_ports port 443
acl Safe_ports port 80 443
acl CONNECT method CONNECT
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow dmz
http_access deny all

# Sin caché: es un laboratorio y queremos ver cada petición
cache deny all

# El proxy pregunta al DNS de la empresa (así sus consultas también se ven)
dns_nameservers 172.30.10.53

# Añade la IP real del cliente en la cabecera X-Forwarded-For
forwarded_for on
via on

# Formato nativo de Squid (lo entiende Wazuh con log_format "squid")
access_log stdio:/var/log/squid/access.log squid
cache_log /var/log/squid/cache.log
pid_filename /run/squid/squid.pid
cache_effective_user squid
coredump_dir /var/spool/squid
