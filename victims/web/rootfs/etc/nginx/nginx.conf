# =============================================================================
#  soc-lab · srv-web · nginx de Hackerlab Logística S.L.
#  HTTP (80) y HTTPS (443, certificado autofirmado). Un solo log para los dos.
# =============================================================================
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Formato "combined" de siempre (el que entiende Wazuh) y, al final, tres
    # campos para el analista:
    #   xff  -> X-Forwarded-For: la IP real si la petición llega por un proxy
    #   tls  -> versión de TLS (vacío si es HTTP)
    #   sni  -> nombre que pidió el cliente en el saludo TLS (vacío si es HTTP)
    log_format soclab '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                      'xff="$http_x_forwarded_for" tls="$ssl_protocol" sni="$ssl_server_name"';
    access_log /var/log/nginx/access.log soclab;

    sendfile        on;
    keepalive_timeout 65;

    server {
        listen      80 default_server;
        server_name srv-web.hackerlab.local www.hackerlab.local _;
        root        /usr/share/nginx/html;
        index       index.html;
    }

    server {
        listen      443 ssl default_server;
        server_name srv-web.hackerlab.local www.hackerlab.local _;
        root        /usr/share/nginx/html;
        index       index.html;

        ssl_certificate     /etc/nginx/ssl/srv-web.crt;
        ssl_certificate_key /etc/nginx/ssl/srv-web.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
    }
}
