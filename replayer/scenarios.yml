# Escenarios de ataque reproducibles en Wazuh.
# Fuentes de las muestras (se descargan al reproducir; no están en este repo):
#   - EVTX-ATTACK-SAMPLES de Samir Bousseaden (GPLv3)
#     https://github.com/sbousseaden/EVTX-ATTACK-SAMPLES
#   - EVTX-to-MITRE-Attack de Michel de Crevoisier (CC0)
#     https://github.com/mdecrevoisier/EVTX-to-MITRE-Attack
# Fijamos un commit concreto de cada una para que todo el mundo vea exactamente lo mismo.
# Cada escenario usa la fuente por defecto salvo que indique "source".
sources:
  evtx-attack-samples:
    repo: sbousseaden/EVTX-ATTACK-SAMPLES
    commit: 4ceed2f4706daf601c212a8f91c113dd85349a2c
    license: GPLv3
  evtx-to-mitre:
    repo: mdecrevoisier/EVTX-to-MITRE-Attack
    commit: 474856008f037ccd42753f02a631b42690195829
    license: CC0
default_source: evtx-attack-samples

